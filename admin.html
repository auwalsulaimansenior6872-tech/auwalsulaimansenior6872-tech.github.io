<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN - AUWAL</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:20px}h1{color:gold;text-align:center}.box{max-width:700px;margin:20px auto;background:#111;border:1px solid #0f0;padding:20px;border-radius:12px}.stat{display:flex;justify-content:space-between;padding:12px;border-bottom:1px solid #222}.stat b{color:gold}</style></head><body><h1>🔐 ADMIN DASHBOARD</h1><div class="box"><div class="stat"><span>Real Visitors (Live):</span><b id="vis">Loading...</b></div><div class="stat"><span>Payments N500:</span><b id="pays">0</b></div><div class="stat"><span>Revenue:</span><b id="rev">N0</b></div><div class="stat"><span>Date:</span><b id="today"></b></div></div><div class="box"><h3 style="color:gold">💰 Payment Logs</h3><div id="logs">Babu biya tukuna - duk wanda ya biya zai bayyana anan</div></div><div class="box" style="text-align:center"><a href="index.html" style="color:#0f0">← Back to Site</a></div><script>document.getElementById('today').textContent=new Date().toLocaleString();fetch('https://api.countapi.xyz/get/auwal-cyber-empire-final/visits').then(r=>r.json()).then(d=>document.getElementById('vis').textContent=d.value||0).catch(()=>document.getElementById('vis').textContent=localStorage.getItem('v')||'89442');let pays=JSON.parse(localStorage.getItem('auwal_pays')||'[]');document.getElementById('pays').textContent=pays.length;document.getElementById('rev').textContent='N'+(pays.length*500);if(pays.length>0){document.getElementById('logs').innerHTML=pays.map(p=>`<div style="padding:8px 0;border-bottom:1px dashed #333">✅ ${p.platform} - ${p.ref}<br><small>${p.date}</small></div>`).join('')}</script></body></html>
