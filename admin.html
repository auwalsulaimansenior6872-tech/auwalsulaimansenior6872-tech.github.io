<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ADMIN</title><style>body{background:#000;color:#0f0;font-family:monospace;padding:20px}h1{color:gold;text-align:center}.box{max-width:800px;margin:20px auto;background:#111;border:1px solid #0f0;padding:20px;border-radius:12px}.stat{display:flex;justify-content:space-between;padding:10px;border-bottom:1px solid #222}.stat b{color:#ff0}</style></head><body><h1>🔐 ADMIN DASHBOARD - AUWAL</h1><div class="box"><div class="stat"><span>Real Visitors:</span><b id="vis">Loading...</b></div><div class="stat"><span>Total Payments N500:</span><b id="pays">0</b></div><div class="stat"><span>Revenue:</span><b id="rev">N0</b></div><div class="stat"><span>Date:</span><b id="today"></b></div></div><div class="box"><h3 style="color:gold">Logs</h3><div id="logs">Babu biya tukuna</div></div><div class="box" style="text-align:center"><a href="index.html" style="color:#0f0">← Back</a></div><script>document.getElementById('today').textContent=new Date().toLocaleString();fetch('https://api.countapi.xyz/hit/auwal-cyber-2026/visits').then(r=>r.json()).then(d=>document.getElementById('vis').textContent=d.value).catch(()=>{let v=localStorage.getItem('auwal_vis')||89442;v=parseInt(v)+1;localStorage.setItem('auwal_vis',v);document.getElementById('vis').textContent=v+' (Local)'});let pays=JSON.parse(localStorage.getItem('auwal_pays')||'[]');document.getElementById('pays').textContent=pays.length;document.getElementById('rev').textContent='N'+(pays.length*500);if(pays.length>0){document.getElementById('logs').innerHTML=pays.map(p=>`<div>✅ ${p.platform} - ${p.ref} - ${p.date}</div>`).join('')}</script></body></html>
