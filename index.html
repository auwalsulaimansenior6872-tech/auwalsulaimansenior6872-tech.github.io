<!DOCTYPE html>
<html>
<head>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Auwal Cyber Tools - LIVE</title>
<script src="https://js.paystack.co/v1/inline.js"></script>
<style>
body{background:#000;color:#0f0;text-align:center;font-family:sans-serif;padding:20px}
h1{color:#0f0}
button{width:90%;padding:20px;margin:10px;font-size:20px;font-weight:bold;border:none;border-radius:10px}
.b1{background:#00ff00;color:#000}
.b2{background:#ffcc00;color:#000}
.b3{background:#00ccff;color:#000}
</style>
</head>
<body>
<h1>AUWAL CYBER TOOLS - LIVE</h1>
<button class="b1" onclick="biya(2000)">BIYA N2,000 DA ATM</button>
<button class="b2" onclick="biya(5000)">BIYA N5,000 DA ATM</button>
<button class="b3" onclick="biya(10000)">BIYA N10,000 DA ATM</button>

<script>
function biya(amount){
  var email = prompt("Saka Email dinka:");
  if(!email) return;
  var handler = PaystackPop.setup({
    key: 'pk_live_bc80f49f89b325f70ee4883f3af616a8e779f9fc 
    email: email,
    amount: amount * 100,
    currency: 'NGN',
    callback: function(response){ alert('Biya ya yi! Ref: '+response.reference); },
    onClose: function(){ alert('Ka soke biya'); }
  });
  handler.openIframe();
}
</script>
</body>
</html>
