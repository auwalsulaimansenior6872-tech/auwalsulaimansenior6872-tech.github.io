<h2 style="font-family:Orbitron;text-align:center;color:#ff00ff">🎬 VIDEO DOWNLOADER NO WATERMARK - N200</h2>
<div class="card" style="border:2px solid #ff00ff"><h3>REAL DOWNLOADER - TikTok FB IG YouTube</h3><input id="videoUrl" placeholder="Saka link: https://vm.tiktok.com/..."><button class="btn" onclick="detectPlatform()" style="background:linear-gradient(90deg,#ff00ff,#aa00ff);color:#fff">GANO PLATFORM</button><br><br><button class="btn btn-lock" id="payVideoBtn" onclick="biyaVideo(200)">🔒 BIYA N200 - BUDE</button><button class="btn" id="dlBtn" style="display:none;background:#ff00ff;color:#fff" onclick="downloadVideo()">⬇️ DOWNLOAD NO WATERMARK</button><div class="out" id="videoOut">Saka link...</div><div id="videoPreview"></div></div>
<script>
let videoPaid=localStorage.getItem('auwal_video_paid')==='true';
if(videoPaid){document.getElementById('payVideoBtn').style.display='none';document.getElementById('dlBtn').style.display='block';}
function detectPlatform(){let url=document.getElementById('videoUrl').value;let p=url.includes('tiktok')?'TikTok - No Watermark':url.includes('facebook')?'Facebook':url.includes('instagram')?'Instagram':url.includes('youtube')||url.includes('youtu.be')?'YouTube':'Unknown';document.getElementById('videoOut').innerText='Platform: '+p+'\nURL: '+url;}
async function downloadVideo(){let url=document.getElementById('videoUrl').value.trim();let o=document.getElementById('videoOut');o.innerText='Loading via Cobalt API...';try{let r=await fetch('https://api.cobalt.tools/api/json',{method:'POST',headers:{'Accept':'application/json','Content-Type':'application/json'},body:JSON.stringify({url:url})});let j=await r.json();if(j.url){o.innerText='✅ READY NO WATERMARK';document.getElementById('videoPreview').innerHTML=`<a href="${j.url}" target="_blank" style="display:block;background:#ff00ff;color:#fff;padding:14px;border-radius:12px;text-align:center;text-decoration:none">⬇️ SAUKE VIDEO</a><br><video src="${j.url}" controls style="width:100%;border-radius:12px"></video>`;}else throw new Error(j.text);}catch(e){document.getElementById('videoPreview').innerHTML=`<a href="https://cobalt.tools/?url=${encodeURIComponent(url)}" target="_blank" style="display:block;background:#00ff88;color:#000;padding:14px;border-radius:12px;text-align:center;text-decoration:none">BUDE A COBALT.TOOLS</a>`;o.innerText='Bude a cobalt.tools - '+e.message;}}
function biyaVideo(a){let em=prompt('Email:');if(!em)return;PaystackPop.setup({key:'pk_live_bc80f49f89b325f70ee4883f3af616a8e779f9fc',email:em,amount:a*100,currency:'NGN',callback:function(r){localStorage.setItem('auwal_video_paid','true');alert('✅ Biya yayi!');location.reload();}}).openIframe();}
</script></body></html>
