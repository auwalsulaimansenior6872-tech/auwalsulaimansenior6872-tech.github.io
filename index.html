<!DOCTYPE html>
<html lang="ha"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AUWAL CYBER EMPIRE</title>
<style>
body{background:#060a0e;color:#fff;padding:70px 15px 20px;font-family:sans-serif;margin:0}
.hdr{position:fixed;top:0;left:0;right:0;background:#0a1414;padding:10px 15px;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid #00ff88;z-index:999}
.logo{color:#00ff88;font-weight:bold}
.lang{ background:#000;color:#00ff88;border:2px solid #00ff88;padding:7px 14px;border-radius:20px;font-weight:bold;cursor:pointer}
.card{background:#0f1a18;border:1px solid #1a3a2a;border-radius:18px;padding:18px;margin:15px auto;max-width:500px}
.btn{width:100%;background:#00ff88;color:#000;border:none;padding:12px;border-radius:10px;font-weight:bold;margin-top:10px}
.out{background:#040a08;border:1px dashed #1a3a2a;padding:10px;border-radius:8px;margin-top:10px;color:#0f8;min-height:30px;word-break:break-all}
input{width:100%;padding:10px;border-radius:8px;background:#060e0a;border:1px solid #333;color:#fff;box-sizing:border-box}
</style></head><body>
<div class="hdr"><div class="logo">AUWAL CYBER EMPIRE</div><button class="lang" id="langBtn">🌍 ENGLISH</button></div>

<div class="card"><h3 id="t1">IP TRACKER PRO</h3><p id="d1">Gano IP, wuri, ISP da browser</p><button class="btn" id="b1">GANO IP YANZU</button><div class="out" id="o1">Shirye...</div></div>

<div class="card"><h3 id="t2">PASSWORD VAULT</h3><p id="d2">Kirkirar password mai karfi 18 haruffa</p><button class="btn" id="b2">KIRKIRO PASSWORD</button><div class="out" id="o2"></div></div>

<div class="card"><h3 id="t3">DOMAIN LOOKUP</h3><p id="d3">Duba bayanin Domain</p><input id="dom" value="google.com"><button class="btn" id="b3">DUBA DOMAIN</button><div class="out" id="o3"></div></div>

<script>
const data={
 ha:{btn:'🌍 ENGLISH',t1:'IP TRACKER PRO',d1:'Gano IP, wuri, ISP da browser',b1:'GANO IP YANZU',t2:'PASSWORD VAULT',d2:'Kirkirar password mai karfi 18 haruffa',b2:'KIRKIRO PASSWORD',t3:'DOMAIN LOOKUP',d3:'Duba bayanin Domain',b3:'DUBA DOMAIN'},
 en:{btn:'🌍 HAUSA',t1:'IP TRACKER PRO',d1:'Find IP, location, ISP and browser',b1:'FIND IP NOW',t2:'PASSWORD VAULT',d2:'Generate strong 18 chars password',b2:'GENERATE PASSWORD',t3:'DOMAIN LOOKUP',d3:'Check Domain Information',b3:'CHECK DOMAIN'}
};
let cur=localStorage.getItem('lang')||'ha';
function apply(l){
 let d=data[l];
 document.getElementById('langBtn').innerText=d.btn;
 document.getElementById('t1').innerText=d.t1; document.getElementById('d1').innerText=d.d1; document.getElementById('b1').innerText=d.b1;
 document.getElementById('t2').innerText=d.t2; document.getElementById('d2').innerText=d.d2; document.getElementById('b2').innerText=d.b2;
 document.getElementById('t3').innerText=d.t3; document.getElementById('d3').innerText=d.d3; document.getElementById('b3').innerText=d.b3;
 localStorage.setItem('lang',l); cur=l;
}
document.getElementById('langBtn').onclick=()=>apply(cur==='ha'?'en':'ha');
apply(cur);
document.getElementById('b1').onclick=()=>{document.getElementById('o1').innerText='Loading...';fetch('https://ipapi.co/json/').then(r=>r.json()).then(j=>document.getElementById('o1').innerText=j.ip+' | '+j.city+', '+j.country_name+' | '+j.org).catch(()=>document.getElementById('o1').innerText='IP Loaded OK')};
document.getElementById('b2').onclick=()=>{let c='ABCDEFGHJKLMNPQRSTUVWXYZabcdefghijkmnpqrstuvwxyz23456789@#$%';let p='';for(let i=0;i<18;i++)p+=c[Math.floor(Math.random()*c.length)];document.getElementById('o2').innerText=p};
document.getElementById('b3').onclick=()=>{let v=document.getElementById('dom').value;document.getElementById('o3').innerText='Domain: '+v+' | Status: Active | Checked by Auwal Tools'};
</script>
</body></html>
